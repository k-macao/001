name: 🐙 章鱼AI · 每日自动推送

on:
  schedule:
    # 早盘推送主档 + 午间补漏/静默更新（错开整点队列拥堵，两档间隔 2.5 小时避免同工作流合并丢档）
    # 配合 tools/push_gate.py 与 output/push_state.json 按「今日早盘/晚间是否已推」去重：
    # · GitHub 准点或延迟至 13~18 时触发时，只要今日早盘未成功推送，自动补推而非丢弃；
    # · 已成功推过早盘后，后续触发展开为 --no-push 静默刷新网页与留痕。
    # 晚间复盘由独立工作流 .github/workflows/octopus-evening.yml 独立排队负责，互不阻塞。
    - cron: "17 1 * * *"    # 北京 09:17（早盘推送主档）
    - cron: "47 3 * * *"    # 北京 11:47（早盘兜底 / 盘中静默更新）

  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅采集预览，不推送"
        type: boolean
        default: false
        required: false
      no_push:
        description: "仅更新数据与生成日报，不推送到微信"
        type: boolean
        default: false
        required: false
      llm_check:
        description: "只探活大模型 API（验证 Key / 端点 / 模型名，不生成日报）"
        type: boolean
        default: false
        required: false
      hk7_only:
        description: "只跑 AI 七日港股走势分析概率（研究模式，不推送）"
        type: boolean
        default: false
        required: false

# 与「🐙 章鱼AI · 晚间自动推送」「🐙 章鱼AI · 手动抓取推送」共用一把锁：三个作业
# 生成同一批文件、推同一个分支，并行跑必然有一方 `git push` 被拒。
# 排队而不取消：取消会打断「已经推到微信、还没提交留痕与推送状态」的那一轮。
concurrency:
  group: octopus-report
  cancel-in-progress: false

jobs:
  octopus-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 量化引擎（21 只标的日线 + 沪深港通 + 港股成交）需要额外抓取时间
    # 声明仓库写入权限，解决git push 403问题
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet -r requirements.txt

      - name: 🐙 运行章鱼AI流水线
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 一对多群组推送（2026-10-23 起默认）：群组编码优先取 Secret PUSHPLUS_TOPIC；
          # Secret 没配时兜底用仓库群组 oai.1（下面这个字面量就是兜底值，换群改这里）。
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC || 'oai.1' }}
          # 推送模式：one2many（默认，一对多群组）/ one2one（一对一 直发自己）。
          PUSHPLUS_MODE: ${{ vars.PUSHPLUS_MODE || 'one2many' }}
          # 策略研判内的 MACD（无需密钥）：优先库 / 本次日线，缺项才取免费源。
          OCTOPUS_MACD: ${{ vars.OCTOPUS_MACD || '1' }}
          OCTOPUS_MACD_SYMBOLS: ${{ vars.OCTOPUS_MACD_SYMBOLS }}
          # ◧ AI 七日港股走势分析概率的大模型（默认 DeepSeek：https://api.deepseek.com）
          # Key 按原名透传，由 output/hk_seven_day.py 按「本仓专用名 → 厂商通用名」回落取用：
          # 仓库里既有的 DEEPSEEK_API_KEY 不必改名换值，配好就能被这一栏用上。
          # 三个都没有 → 该栏目整体缺席（不进审计），日报其它栏目照常；
          # 想「没有 Key 也看量化基准」→ OCTOPUS_HK7_FALLBACK: "1"
          OCTOPUS_LLM_API_KEY: ${{ secrets.OCTOPUS_LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 下面两个都可以留空：留空 = https://api.deepseek.com/v1；模型留空则按候选链
          # （deepseek-flash → deepseek-v4-flash → deepseek-chat …）逐个试，只有「模型名不对」才换下一个
          OCTOPUS_LLM_BASE_URL: ${{ vars.OCTOPUS_LLM_BASE_URL }}
          OCTOPUS_LLM_MODEL: ${{ vars.OCTOPUS_LLM_MODEL }}
          # JSON 被截断时调大（如 2048）；留空 = 用服务端默认
          OCTOPUS_LLM_MAX_TOKENS: ${{ vars.OCTOPUS_LLM_MAX_TOKENS }}
          # OCTOPUS_LLM_TIMEOUT: "60"
          # OCTOPUS_HK7_FALLBACK: "1"
          # ⚠️ 研报 AI 风险点提示（照抄 k-macao/007 最新一篇「## ⚠️ 研报 AI 风险点提示」）：
          #   ① 优先直读 007 已发布正文（OCTOPUS_007_BRIEF_URL / 007 仓库文件）/ 跨仓日志
          #      （OCTOPUS_007_GH_TOKEN）/ 旧接口（OCTOPUS_007_BASE_URL）；
          #   ② 取不到时自动拉取公开的 k-macao/007 最新源码在本地安全 --dry-run 同源生成；
          #   ③ 断网兜底 007 原文模板 + 本地标题池。
          OCTOPUS_007_BRIEF_URL: ${{ vars.OCTOPUS_007_BRIEF_URL }}
          OCTOPUS_007_GH_TOKEN: ${{ secrets.OCTOPUS_007_GH_TOKEN }}
          OCTOPUS_007_BASE_URL: ${{ vars.OCTOPUS_007_BASE_URL }}
          OCTOPUS_007_AUTO_RUN: ${{ vars.OCTOPUS_007_AUTO_RUN || '1' }}
          # 关掉整栏（排查用）：OCTOPUS_RESEARCH_RISK: "0"
        run: |
          set -euo pipefail
          EVENT_NAME="${{ github.event_name }}"
          # 兜底空值，兼容定时触发场景
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          NO_PUSH="${{ github.event.inputs.no_push || 'false' }}"
          LLM_CHECK="${{ github.event.inputs.llm_check || 'false' }}"
          HK7_ONLY="${{ github.event.inputs.hk7_only || 'false' }}"

          CURRENT_HOUR=$(TZ='Asia/Shanghai' date +%H:%M)

          # 只报「有没有配、配在哪个变量名上」，绝不回显 Key 本身
          LLM_KEY_SOURCE=""
          for name in OCTOPUS_LLM_API_KEY DEEPSEEK_API_KEY OPENAI_API_KEY; do
            if [ -n "${!name:-}" ]; then LLM_KEY_SOURCE="$name"; break; fi
          done
          if [ -n "$LLM_KEY_SOURCE" ]; then
            echo "◧ 大模型：已配置 Key（来源 ${LLM_KEY_SOURCE} · 端点 ${OCTOPUS_LLM_BASE_URL:-默认 https://api.deepseek.com/v1} · 模型 ${OCTOPUS_LLM_MODEL:-未指定 → 候选链自动挑}）"
          else
            echo "◧ 大模型：未配置 Key（OCTOPUS_LLM_API_KEY / DEEPSEEK_API_KEY / OPENAI_API_KEY 都没有）→ AI 七日港股走势分析概率整栏缺席"
            echo "   修复：仓库 Settings → Secrets and variables → Actions 新增 DEEPSEEK_API_KEY；或用 llm_check 勾选手动运行先探活"
          fi

          if [ "$LLM_CHECK" = "true" ]; then
            echo "运行模式：大模型 API 探活（不生成日报）"
            python3 output/pipeline.py --llm-check
          elif [ "$HK7_ONLY" = "true" ]; then
            echo "运行模式：只跑 AI 七日港股走势分析概率（研究模式，不推送）"
            python3 output/pipeline.py --hk7-only
          elif [ "$DRY_RUN" = "true" ]; then
            echo "运行模式：预览模式（不推送）"
            python3 output/pipeline.py --dry-run
          elif [ "$NO_PUSH" = "true" ]; then
            echo "运行模式：手动指定静默更新（--no-push，不推微信）"
            python3 output/pipeline.py --no-push
          elif [ "$EVENT_NAME" = "schedule" ]; then
            DECISION=$(python3 tools/push_gate.py decide --state output/push_state.json --format tsv)
            IFS=$'\t' read -r GATE_MODE TARGET_DATE GATE_SLOT GATE_REASON <<< "$DECISION"
            echo "📅 定时推送门禁：mode=${GATE_MODE} | date=${TARGET_DATE} | slot=${GATE_SLOT} | ${GATE_REASON}"
            if [ "$GATE_MODE" = "push" ]; then
              RUN_LOG=$(mktemp)
              set +e
              python3 output/pipeline.py 2>&1 | tee "$RUN_LOG"
              PIPE_RC=${PIPESTATUS[0]}
              set -e
              if [ "$PIPE_RC" -ne 0 ]; then
                rm -f "$RUN_LOG"
                exit "$PIPE_RC"
              fi
              if python3 tools/push_gate.py verify-log --log "$RUN_LOG"; then
                python3 tools/push_gate.py record \
                  --state output/push_state.json \
                  --date "$TARGET_DATE" \
                  --slot "$GATE_SLOT" \
                  --workflow "octopus-daily.yml" \
                  --run-id "${{ github.run_id }}"
              else
                echo "ℹ️ 本次未实际送出日报正文（例如当天检验未通过仅发提醒），保留 ${TARGET_DATE} ${GATE_SLOT} 待补推状态。"
              fi
              rm -f "$RUN_LOG"
            else
              python3 output/pipeline.py --no-push
            fi
          else
            echo "运行模式：手动全流程生成并推送微信（当前北京时间 ${CURRENT_HOUR}）"
            python3 output/pipeline.py
          fi

      - name: 📤 提交生成的日报
        # 即使推送失败，只要文件生成了就提交
        if: always()
        run: |
          set -euo pipefail
          COMMIT_TIME=$(TZ='Asia/Macau' date +'%Y-%m-%d %H:%M')
          bash tools/safe_push.sh \
            --branch "${GITHUB_REF_NAME:-main}" \
            --message "📰 自动更新 ${COMMIT_TIME}" \
            -- output/daily_report_*.html output/latest.html \
               output/sentiment_history.json output/news_history.json \
               output/quant_history.json output/hk7_forecast.json \
               output/weekly_forecast.json output/push_state.json

      - name: 🧯 推送失败兜底：把生成物存成 Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: octopus-unpushed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/daily_report_*.html
            output/latest.html
            output/sentiment_history.json
            output/news_history.json
            output/quant_history.json
            output/hk7_forecast.json
            output/weekly_forecast.json
            output/push_state.json
          if-no-files-found: ignore
          retention-days: 14
