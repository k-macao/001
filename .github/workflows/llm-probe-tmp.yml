name: 🧪 LLM 探活（临时 · 用真实 Secret 回答「这一栏能不能出内容」）

# 一次性验证装置（临时文件，验证完即删）：结论写进 output/llm_probe_tmp.txt 并推回本分支，
# 因为沙箱读不到 Actions 日志（results-receiver 出网被拦），只能靠仓库文件把结论带回来。
on:
  push:
    branches:
      - arena/1ed464f9-02
    paths-ignore:
      - "output/llm_probe_tmp.txt"     # 结果文件本身不触发（否则自我循环）

permissions:
  contents: write

concurrency:
  group: llm-probe-tmp
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests

      - name: 🧪 探活（只报变量名，绝不回显 Key）
        env:
          OCTOPUS_LLM_API_KEY: ${{ secrets.OCTOPUS_LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OCTOPUS_LLM_BASE_URL: ${{ vars.OCTOPUS_LLM_BASE_URL }}
          OCTOPUS_LLM_MODEL: ${{ vars.OCTOPUS_LLM_MODEL }}
        run: |
          # GitHub Actions 的 run 默认是 bash -e：关掉它——探活的失败原因本身就是要带回来的结论
          set +e
          set -uo pipefail
          OUT=output/llm_probe_tmp.txt
          {
            echo "# 🧪 LLM 探活结果（临时文件 · 自动生成）"
            echo "run: $GITHUB_RUN_ID · $(TZ='Asia/Macau' date +'%Y-%m-%d %H:%M') · ref: $GITHUB_REF_NAME"
            echo
            echo "## 0) Secret 有无（只报有没有，绝不回显值）"
            for name in OCTOPUS_LLM_API_KEY DEEPSEEK_API_KEY OPENAI_API_KEY; do
              if [ -n "${!name:-}" ]; then echo "  $name = SET"; else echo "  $name = (empty)"; fi
            done
            echo "  OCTOPUS_LLM_BASE_URL = ${OCTOPUS_LLM_BASE_URL:-(empty)}"
            echo "  OCTOPUS_LLM_MODEL = ${OCTOPUS_LLM_MODEL:-(empty)}"
            echo
            echo "## 1) pipeline --llm-check"
            python3 output/pipeline.py --llm-check
            echo "(exit=$?)"
            echo
            echo "## 2) pipeline --hk7-only（真实行情 + 真实 Key）"
            python3 output/pipeline.py --hk7-only
            echo "(exit=$?)"
          } > /tmp/llm_probe.txt 2>&1
          cp /tmp/llm_probe.txt "$OUT"

      - name: 🔬 枚举「模型 × 请求形态」——定位 402 的范围
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OCTOPUS_LLM_API_KEY: ${{ secrets.OCTOPUS_LLM_API_KEY }}
        run: |
          set +e
          set -uo pipefail
          OUT=output/llm_probe_tmp.txt
          {
            echo
            echo "## 3) 枚举：目录里的每个模型 × 三种请求形态（状态码 + 服务端原话）"
            python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          key = ""
          for name in ("OCTOPUS_LLM_API_KEY", "DEEPSEEK_API_KEY", "OPENAI_API_KEY"):
              if (os.environ.get(name) or "").strip():
                  key = os.environ[name].strip()
                  print(f"Key 来源：{name}（值不回显）")
                  break
          else:
              print("没有 Key，跳过枚举")
              raise SystemExit(0)

          BASE = "https://api.deepseek.com/v1"


          def call(method, path, body=None):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  method=method,
                  headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json",
                           "User-Agent": "octopus-llm-probe/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")[:300]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:300]
              except Exception as e:
                  return "ERR", f"{type(e).__name__}: {e}"


          status, body = call("GET", "/models")
          ids = [it.get("id") for it in (json.loads(body).get("data") or [])] if status == 200 else []
          print(f"/models → {status} · {ids or body}")

          variants = {
              "plain（最小请求）": lambda m: {"model": m, "messages": [{"role": "user", "content": "hi"}],
                                              "max_tokens": 4},
              "json_object": lambda m: {"model": m, "messages": [{"role": "user", "content": '回复 JSON {"ok":true}'}],
                                        "max_tokens": 32, "response_format": {"type": "json_object"}},
              "temperature=0.2": lambda m: {"model": m, "temperature": 0.2,
                                            "messages": [{"role": "user", "content": "hi"}], "max_tokens": 4},
          }
          for mid in ids:
              for label, build in variants.items():
                  st, bd = call("POST", "/chat/completions", build(mid))
                  print(f"  {mid:<20} {label:<18} → HTTP {st} · {bd[:180]}")
          for alias in ("deepseek-chat", "deepseek-reasoner", "deepseek-v4-flash"):
              st, bd = call("POST", "/chat/completions",
                            {"model": alias, "messages": [{"role": "user", "content": "hi"}], "max_tokens": 4})
              print(f"  {alias:<20} {'历史别名':<18} → HTTP {st} · {bd[:180]}")
          PY
          } >> "$OUT" 2>&1

      - name: 📤 提交探活结果
        run: |
          set -euo pipefail
          git config user.name octopus-bot
          git config user.email bot@octopus.ai
          git add -f output/llm_probe_tmp.txt
          git commit -qm "🧪 LLM 探活结果（临时文件）" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
