name: 🧪 LLM 探活（临时 · 用真实 Secret 回答「这一栏能不能出内容」）

# 一次性验证装置（临时文件，验证完即删）。结论写进 output/llm_probe_tmp.txt 并推回本分支：
# 沙箱读不到 Actions 日志（results-receiver 出网被拦），只能靠仓库文件把结论带回来。
#
#   ① 真实 Key：报「配在哪个变量名上」+ pipeline --llm-check（配置 / /models / 逐模型真实请求）
#   ② 假端点：tools/llm_mock_tmp.py 在 127.0.0.1 上假扮 OpenAI 兼容服务，
#      证明「Key + 端点 → 研判引擎 → 日报栏目」这条链路本身是通的（真实 Key 目前 402，
#      只有把端点换成本地假服务，才能把接线问题与余额问题分开看）
on:
  push:
    branches:
      - arena/1ed464f9-02
    paths-ignore:
      - "output/llm_probe_tmp.txt"     # 结果文件本身不触发（否则自我循环）

permissions:
  contents: write

concurrency:
  group: llm-probe-tmp
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安装依赖
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          pip install --quiet requests

      - name: 🧪 探活（只报变量名，绝不回显 Key）
        env:
          OCTOPUS_LLM_API_KEY: ${{ secrets.OCTOPUS_LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OCTOPUS_LLM_BASE_URL: ${{ vars.OCTOPUS_LLM_BASE_URL }}
          OCTOPUS_LLM_MODEL: ${{ vars.OCTOPUS_LLM_MODEL }}
        run: |
          # GitHub Actions 的 run 默认 bash -e：关掉它——探活失败本身就是要带回来的结论
          set +e
          set -uo pipefail
          OUT=output/llm_probe_tmp.txt
          {
            echo "# 🧪 LLM 探活结果（临时文件 · 自动生成）"
            echo "run: $GITHUB_RUN_ID · $(TZ='Asia/Macau' date +'%Y-%m-%d %H:%M') · ref: $GITHUB_REF_NAME"
            echo
            echo "## 0) Secret 有无（只报有没有，绝不回显值）"
            for name in OCTOPUS_LLM_API_KEY DEEPSEEK_API_KEY OPENAI_API_KEY; do
              if [ -n "${!name:-}" ]; then echo "  $name = SET"; else echo "  $name = (empty)"; fi
            done
            echo "  OCTOPUS_LLM_BASE_URL = ${OCTOPUS_LLM_BASE_URL:-(empty)}"
            echo "  OCTOPUS_LLM_MODEL = ${OCTOPUS_LLM_MODEL:-(empty)}"
            echo
            echo "## 1) 真实 Key：pipeline --llm-check"
            python3 output/pipeline.py --llm-check
            echo "(exit=$?)"
          } > /tmp/llm_probe.txt 2>&1
          cp /tmp/llm_probe.txt "$OUT"

      - name: 🎭 假端点：证明接线本身是通的
        run: |
          set +e
          set -uo pipefail
          OUT=output/llm_probe_tmp.txt
          python3 tools/llm_mock_tmp.py 8899 &
          MOCK_PID=$!
          sleep 2
          export OCTOPUS_LLM_API_KEY="mock-key"
          export OCTOPUS_LLM_BASE_URL="http://127.0.0.1:8899/v1"
          export OCTOPUS_LLM_MODEL="deepseek-flash"
          {
            echo
            echo "## 2) 假端点（127.0.0.1 回环，不出网）：pipeline --llm-check"
            python3 output/pipeline.py --llm-check
            echo "(exit=$?)"
            echo
            echo "## 3) 假端点：pipeline --hk7-only"
            python3 output/pipeline.py --hk7-only
            echo "(exit=$?)"
            echo
            echo "## 4) 假端点：完整流水线 --no-push，再看日报里这一栏"
            python3 output/pipeline.py --no-push
            echo "(exit=$?)"
            LATEST=$(ls -t output/daily_report_*.html | head -1)
            echo "文件：$LATEST"
            if grep -q "AI 七日港股" "$LATEST"; then
              echo "结论：日报里出现了「AI 七日港股」栏目"
            else
              echo "结论：日报里没有「AI 七日港股」栏目（整栏缺席）"
            fi
            echo "栏目里的引擎标注（grep）："
            grep -o "大模型 · [^<]\{0,40\}" "$LATEST" | sort -u | head -5
            grep -o "文案数字溯源[^<]\{0,40\}" "$LATEST" | sort -u | head -3
          } >> "$OUT" 2>&1
          kill $MOCK_PID 2>/dev/null
          true

      - name: 📤 提交探活结果
        if: always()
        run: |
          set -euo pipefail
          git config user.name octopus-bot
          git config user.email bot@octopus.ai
          git add -f output/llm_probe_tmp.txt
          git commit -qm "🧪 LLM 探活结果（临时文件）" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
